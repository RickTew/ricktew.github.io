<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>To the checkout | HI Ninja | Rick Tew</title>
<link rel="icon" href="/assets/images/favicon.png">
<!-- The HI door's copy of the Shop's buy step (9 Oct 2026): a GNS buyer hovering Buy
     sees ricktew.com/hininja/buy/, not a shop address (all three readers of the
     HI round asked why a training trip went through /aininja/shop/). Same check,
     same forward to the Dojo's one checkout. Originally, in the Shop: (the Dojo's
     legal floor: a Buy button should not show the provider's address when you
     hover it). The button links here with ?sku= (and ?src= from a post); this
     page checks both against a fixed shape and hands them to the Dojo's one
     checkout, which answers with the secure payment page. Nothing is stored. -->
<style>
body{margin:0;background:#fff;color:#101418;font:600 17px/1.6 "Nunito","Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:18vh auto 0;padding:0 24px;text-align:center}
a{color:#175a94;font-weight:800}
</style>
</head>
<body>
<main>
  <p id="msg">Taking you to the secure checkout...</p>
  <noscript><p>The checkout needs JavaScript. Turn it on and press Buy again, or <a href="/aininja/#opt-8c">write to me</a>.</p></noscript>
</main>
<script>
(function(){
  var FN="https://qegfhbseccinnxnzfhxw.supabase.co/functions/v1/ricktew-shop/buy";
  var q; try{ q=new URLSearchParams(location.search); }catch(e){ q=null; }
  var sku=(q&&q.get("sku"))||"", src=(q&&q.get("src"))||"";
  if(!/^[A-Z]{2,5}-[A-Z0-9-]{2,40}$/.test(sku)){
    document.getElementById("msg").innerHTML='That link is missing its product. <a href="/hininja/">Back to HI Ninja</a>.';
    return;
  }
  location.replace(FN+"?sku="+encodeURIComponent(sku)+(/^[A-Za-z0-9_-]{1,200}$/.test(src)?"&src="+encodeURIComponent(src):""));
})();
</script>
</body>
</html>
