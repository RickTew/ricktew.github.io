body{margin:0;background:#fff;color:#101418;font:600 17px/1.6 "Nunito","Helvetica Neue",Arial,sans-serif}

<body>
<main>
  <p id="msg">Taking you to the secure checkout...</p>
  <noscript><p>The checkout needs JavaScript. Turn it on and press Buy again, or <a href="/aininja/#opt-8c">write to me</a>.</p></noscript>
</main>
<script>
(function(){
  var FN="https://qegfhbseccinnxnzfhxw.supabase.co/functions/v1/ricktew-shop/buy";
  var q; try{ q=new URLSearchParams(location.search); }catch(e){ q=null; }
  var sku=(q&&q.get("sku"))||"", src=(q&&q.get("src"))||"", weeks=(q&&q.get("weeks"))||"", pay=(q&&q.get("pay"))||"";
  if(!/^[A-Z]{2,5}-[A-Z0-9-]{2,40}$/.test(sku)){
    document.getElementById("msg").innerHTML='That link is missing its product. <a href="/hininja/">Back to the Martial Arts Ninja Course</a>.';
    return;
  }
  location.replace(FN+"?sku="+encodeURIComponent(sku)+(/^[A-Za-z0-9_-]{1,200}$/.test(src)?"&src="+encodeURIComponent(src):"")+(/^[1-8]$/.test(weeks)?"&weeks="+weeks:"")+(/^(deposit|full)$/.test(pay)?"&pay="+pay:"")+"&cur=thb"); /* every Buy pays Rick Tew Co., 21 Oct 2026: see /assets/th.js */
})();
</script>
