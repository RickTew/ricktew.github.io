<style>
:root{--bg:#ffffff;--ink:#101418;--muted:#69707a;--blue:#1e73bd;--red:#d61f26;--line:#e8e6e2;--panel:#f7f6f4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.6}
h1{font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:clamp(26px,4vw,38px);line-height:1.1}
.wrap{max-width:860px;margin:0 auto;padding:40px 24px 80px}
.k{font-size:12px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--blue)}
.note{margin-top:12px;color:var(--muted);font-weight:700}
.note a{color:var(--blue)}
.hows{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px 20px}
.hows .how-lead{margin-top:8px;font-size:15px;font-weight:700;color:var(--ink);line-height:1.45}
.hows .how-board{margin-top:16px;max-width:none}
.hows .how-board .sb-body{color:#4b5563}
.hows .how-board+.how-steps{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
@media (max-width:460px){ .hows .how-board .sb-ctl{flex-direction:column;align-items:flex-start;gap:10px} .hows .how-board .sb-btns button{white-space:nowrap} }
.how-steps{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 24px}
.how-steps li{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700;color:var(--ink);line-height:1.45}
.how-steps b{font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:26px;line-height:1;color:var(--blue)}
.hows .how-note{margin-top:14px;font-size:14px;font-weight:600;color:#4b5563;line-height:1.5}
/* The five words as a storyboard (the Dojo's "show it, then say it" way,
   first run outside WinJitsu, 21 Sep 2026). Five boxes, one word each, one
   small SVG motion per box that plays once it is on screen and then waits;
   the dots, Back, Replay and Next are for getting around. The reading stays
   under "Read more". Pure SVG and CSS keyframes, no library. */
.sb{margin-top:34px;max-width:760px}
.sb .k{margin-bottom:12px}
.sb-frame{--play:paused;aspect-ratio:1320/780;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sb-frame svg{display:block;width:100%;height:100%;font-family:"Nunito","Helvetica Neue",Arial,sans-serif}
.sb-ctl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.sb-dots{display:flex;align-items:center;gap:6px}
.sb-dots button{width:10px;height:10px;padding:0;border:0;border-radius:999px;background:var(--line);cursor:pointer;transition:width .2s ease,background .2s ease}
.sb-dots button.done{background:#a9c8e6}
.sb-dots button[aria-current]{width:24px;background:var(--blue)}
.sb-btns{display:flex;align-items:center;gap:8px}
.sb-btns button{font:inherit;font-size:14px;font-weight:800;padding:8px 14px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.sb-btns button:hover{border-color:var(--blue);color:var(--blue)}
.sb-btns .sb-back{border-color:transparent;color:var(--muted)}
.sb-btns .sb-next{background:var(--blue);border-color:var(--blue);color:#fff}
.sb-btns .sb-next:hover{background:#185f9d;color:#fff}
.sb-cap{margin:14px 0 0;font-size:clamp(16px,2vw,19px);font-weight:800;line-height:1.35;color:var(--ink)}
.sb-body{margin:6px 0 0;font-size:15px;line-height:1.55;color:var(--muted)}
.sb-more{margin-top:14px;font-size:14.5px;line-height:1.6;color:var(--muted)}
.sb-more summary{cursor:pointer;font-weight:800;color:var(--ink);list-style:none;display:inline-flex;align-items:center;gap:8px}
.sb-more summary::-webkit-details-marker{display:none}
.sb-more summary::after{content:"+";font-weight:900;color:var(--blue)}
.sb-more[open] summary::after{content:"\2212"}
.sb-more p{margin:8px 0 0;max-width:760px}
/* the first box arrives drawn (round seven, 1 Oct 2026: a scrolling reader saw an empty frame) */
.sb-frame.sb-end .is [class*="-"]:not(.is-cycle){animation-delay:-60s !important}  /* the cycling sign keeps its own stagger, or all its names land on top of each other */
.sb-wrap{margin-top:22px}
.sb-wrap>summary{display:inline-block;cursor:pointer;list-style:none;font-weight:900;font-size:15px;color:var(--blue);border-bottom:2px solid currentColor;padding-bottom:1px}
.sb-wrap>summary::-webkit-details-marker{display:none}
.sb-wrap>summary::after{content:" +"}
.sb-wrap[open]>summary::after{content:" \2212"}
.dojo-more{margin-top:26px}
.dojo-more>summary{display:block;width:max-content;max-width:100%;margin:0 auto;cursor:pointer;list-style:none;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:12px 22px;font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:15px}
.dojo-more>summary::-webkit-details-marker{display:none}
.dojo-more>summary::after{content:" +";color:var(--blue)}
.dojo-more[open]>summary::after{content:" \2212"}
/* the motion vocabulary inside every box: each class plays once, keeps its
   end frame, and reads the frame's --play so nothing runs off screen */
.is [class*="-"]{transform-box:fill-box;transform-origin:center;animation-play-state:var(--play,running);animation-fill-mode:both}
.is .is-pop{animation-name:is-pop;animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.9,.3,1.3)}
.is .is-in{opacity:0;animation-name:is-in;animation-duration:.5s;animation-timing-function:ease-out}
.is .is-show{opacity:0;animation-name:is-show;animation-duration:.4s;animation-timing-function:ease-out}
.is .is-out{animation-name:is-out;animation-duration:.6s;animation-timing-function:ease-out}
.is .is-grow{transform-origin:center bottom;animation-name:is-grow;animation-duration:.9s;animation-timing-function:cubic-bezier(.3,.7,.3,1)}
.is .is-wide{transform-origin:left center;animation-name:is-wide;animation-duration:1.1s;animation-timing-function:cubic-bezier(.3,.7,.3,1)}
.is .is-draw{stroke-dasharray:1;animation-name:is-draw;animation-duration:1.2s;animation-timing-function:ease-in-out}
.is .is-slide{animation-name:is-slide;animation-duration:.9s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
.is .is-pulse{animation-name:is-pulse;animation-duration:1.4s;animation-timing-function:ease-in-out;animation-iteration-count:3}
.is .is-cycle{opacity:0;animation-name:is-cycle;animation-duration:4.5s;animation-timing-function:linear;animation-iteration-count:infinite}
.is .is-drop{animation-name:is-drop;animation-duration:.7s;animation-timing-function:cubic-bezier(.3,.7,.4,1.2)}
@keyframes is-pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes is-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes is-show{from{opacity:0}to{opacity:1}}
@keyframes is-out{to{opacity:0}}
@keyframes is-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes is-wide{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes is-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes is-slide{from{transform:translate(var(--fx,0px),var(--fy,0px))}to{transform:translate(var(--tx,0px),var(--ty,0px))}}
@keyframes is-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes is-cycle{0%{opacity:0}4%{opacity:1}28%{opacity:1}32%{opacity:0}100%{opacity:0}}
@keyframes is-drop{from{transform:translateY(-260px);opacity:0}30%{opacity:1}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){
  .is [class*="-"]{animation:none !important}
  .is .is-in{opacity:1}
  .is .is-show{opacity:1}
  .is .is-out{opacity:0}
  .is .is-draw{stroke-dashoffset:0}
  .is .is-slide{transform:translate(var(--tx,0px),var(--ty,0px))}
  .is .is-cycle{opacity:0}
  .is .is-cycle-first{opacity:1}
}
@media (max-width:520px){
  .sb-btns button{padding:8px 11px;font-size:13px}
  .sb-ctl{gap:8px}
}

<script>
function rtBoard(rootId,p,SCENES){
  var root=document.getElementById(rootId); if(!root) return;
  var frame=document.getElementById(p+"Frame"), dots=document.getElementById(p+"Dots"),
      cap=document.getElementById(p+"Cap"), body=document.getElementById(p+"Body"),
      back=document.getElementById(p+"Back"), replay=document.getElementById(p+"Replay"), next=document.getElementById(p+"Next");
  var HOLD=1.6, i=0, timer=null, inView=false, firstDrawn=true;
  var still=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  SCENES.forEach(function(sc,k){
    var b=document.createElement("button"); b.type="button"; b.setAttribute("aria-label","Box "+(k+1));
    b.addEventListener("click",function(){ go(k); });
    dots.appendChild(b);
  });
  function arm(){
    clearTimeout(timer);
    if(still || !inView || document.hidden || i===SCENES.length-1) return;
    timer=setTimeout(function(){ go(i+1); },(SCENES[i].sec+HOLD)*1000);
  }
  function render(){
    var sc=SCENES[i], last=i===SCENES.length-1;
    frame.innerHTML=sc.svg;
    frame.classList.toggle("sb-end", firstDrawn && i===0);
    cap.textContent=sc.cap; body.textContent=sc.body;
    Array.prototype.forEach.call(dots.children,function(b,k){
      if(k===i) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current");
      b.classList.toggle("done",k<i);
    });
    dots.setAttribute("aria-label","Box "+(i+1)+" of "+SCENES.length);
    back.hidden=(i===0);
    next.textContent=last?"From the top":"Next \u2192";
    arm();
  }
  function go(k){ firstDrawn=false; i=Math.max(0,Math.min(k,SCENES.length-1)); render(); }
  back.addEventListener("click",function(){ go(i-1); });
  replay.addEventListener("click",function(){ firstDrawn=false; render(); });
  next.addEventListener("click",function(){ go(i===SCENES.length-1?0:i+1); });
  document.addEventListener("visibilitychange",function(){ if(document.hidden) clearTimeout(timer); else arm(); });
  render();
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){
      if(!es[0].isIntersecting) return;
      inView=true; frame.style.setProperty("--play","running"); arm(); io.disconnect();
    },{threshold:.4});
    io.observe(frame);
  } else { inView=true; frame.style.setProperty("--play","running"); arm(); }
}
